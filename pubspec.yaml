name: road_data_collector
description: "A Flutter app for collecting road condition data."
publish_to: 'none'

version: 1.3.0+3

environment:
  sdk: ">=3.12.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^16.0.0
  flutter_riverpod: ^2.6.1
  permission_handler: ^12.0.1
  sensors_plus: ^6.1.2
  geolocator: ^14.0.2
  camera: ^0.11.2+1
  path_provider: ^2.1.5
  path: ^1.9.1
  share_plus: ^11.0.0
  video_player: ^2.10.0
  chewie: ^1.12.1
  shared_preferences: ^2.5.3
  flutter_map: ^8.2.1
  latlong2: ^0.9.1
  archive: ^4.0.7
  wakelock_plus: ^1.5.2
  

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true